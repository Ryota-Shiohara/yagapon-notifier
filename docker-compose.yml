services:
  # ========================================
  # Discordボットサービス
  # ========================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yagapon-notifier-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - BOT_NOTIFY_SECRET=${BOT_NOTIFY_SECRET}
      - NOTIFICATION_CHANNEL_ID=${NOTIFICATION_CHANNEL_ID}
      - RECEIPT_NOTIFICATION_CHANNEL_ID=${RECEIPT_NOTIFICATION_CHANNEL_ID}
      - RECEIPT_NOTIFICATION_ROLE_ID=${RECEIPT_NOTIFICATION_ROLE_ID}
      - FORM_CHANNELS=${FORM_CHANNELS}
      - FORM_ROLES=${FORM_ROLES}
      - DEPARTMENT_CHANNELS=${DEPARTMENT_CHANNELS}
      - DEPARTMENT_ROLES=${DEPARTMENT_ROLES}
      - MONTHLY_URL=${MONTHLY_URL}
      - IDEMPOTENCY_STORE_PATH=/app/data/idempotency.json
      - IDEMPOTENCY_TTL_MS=${IDEMPOTENCY_TTL_MS:-604800000}
      - IDEMPOTENCY_PROCESSING_TTL_MS=${IDEMPOTENCY_PROCESSING_TTL_MS:-600000}
      - MARKDOWN_PREVIEW_ENABLED=${MARKDOWN_PREVIEW_ENABLED:-false}
      - MARKDOWN_PREVIEW_PUBLIC_URL=${MARKDOWN_PREVIEW_PUBLIC_URL:-}
      - MARKDOWN_PREVIEW_CHANNEL_IDS=${MARKDOWN_PREVIEW_CHANNEL_IDS:-*}
      - MARKDOWN_PREVIEW_STORE_PATH=/app/data/markdown
      - MARKDOWN_PREVIEW_MAX_FILE_BYTES=${MARKDOWN_PREVIEW_MAX_FILE_BYTES:-1048576}
      - MARKDOWN_PREVIEW_MAX_TOTAL_BYTES=${MARKDOWN_PREVIEW_MAX_TOTAL_BYTES:-104857600}
      - MARKDOWN_PREVIEW_MAX_FILES=${MARKDOWN_PREVIEW_MAX_FILES:-1000}
      - MARKDOWN_PREVIEW_TTL_MS=${MARKDOWN_PREVIEW_TTL_MS:-604800000}
      - MARKDOWN_PREVIEW_DOWNLOAD_TIMEOUT_MS=${MARKDOWN_PREVIEW_DOWNLOAD_TIMEOUT_MS:-10000}
      - MARKDOWN_PREVIEW_CLEANUP_INTERVAL_MS=${MARKDOWN_PREVIEW_CLEANUP_INTERVAL_MS:-3600000}
    # ポートマッピング（開発・デバッグ用、Cloudflare Tunnel経由なら不要）
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    networks:
      - bot-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:3000/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Cloudflare Tunnelサービス
  # ========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: yagapon-notifier-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - bot-network
    depends_on:
      - bot
    security_opt:
      - seccomp=unconfined
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

networks:
  bot-network:
    driver: bridge
